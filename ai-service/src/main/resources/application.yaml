jwt.secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyThatIsAtLeast32BytesLong123!}

app:
  excel:
    template-path: ${EXCEL_TEMPLATE_PATH:test_results1.xlsx}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ai-service}
